<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سیستم برداشت مختصات کارگاهی</title>
    <!-- تنظیمات مقیاس صفحه برای جلوگیری از زوم شدن ناخواسته در موبایل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- فراخوانی کتابخانه‌های استاندارد از سرورهای ابری -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <style>
        /* ریست کردن حاشیه‌های پیش‌فرض مرورگر */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Tahoma, Arial, sans-serif; 
            background-color: #f4f4f4;
        }
        
        /* نقشه کل صفحه را پر می‌کند */
        #surveyMap { 
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }
        
        /* پنل شناور اطلاعات در گوشه بالا */
        .info-panel {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(5px);
            padding: 15px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 13px; 
            border: 1px solid #e0e0e0;
            min-width: 180px;
        }
        
        /* دکمه شناور در گوشه پایین */
        .export-btn {
            position: absolute; 
            bottom: 30px; 
            left: 30px; 
            z-index: 1000;
            background-color: #0056b3; 
            color: white; 
            border: none;
            padding: 14px 24px; 
            border-radius: 30px; 
            cursor: pointer;
            font-weight: bold; 
            font-family: inherit; 
            box-shadow: 0 4px 10px rgba(0,86,179,0.4);
            transition: background 0.3s;
        }
        
        .export-btn:hover { background-color: #004494; }
        
        .data-row { margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .data-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .data-value { font-weight: bold; direction: ltr; display: inline-block; float: left; color: #333; }
    </style>
</head>
<body>

    <!-- کانتینر اصلی نقشه -->
    <div id="surveyMap"></div>

    <!-- نمایشگر مختصات -->
    <div class="info-panel">
        <div class="data-row">سیستم تصویر: <span class="data-value" id="zoneDisplay">در حال جستجو...</span></div>
        <div class="data-row">Easting (X): <span class="data-value" id="xDisplay">---</span></div>
        <div class="data-row">Northing (Y): <span class="data-value" id="yDisplay">---</span></div>
        <div class="data-row">شعاع خطا: <span class="data-value" id="accDisplay">---</span></div>
    </div>

    <!-- دکمه خروجی -->
    <button class="export-btn" id="exportData">ارسال گزارش نقطه</button>

    <script>
        // ۱. راه‌اندازی اولیه نقشه
        const topoMap = L.map('surveyMap', { zoomControl: false }).fitWorld();
        
        // افزودن دکمه زوم به گوشه پایین راست (برای تداخل نداشتن با پنل اطلاعات)
        L.control.zoom({ position: 'bottomright' }).addTo(topoMap);

        // استفاده از لایه استاندارد OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(topoMap);

        // تعریف متغیرهای سراسری
        let siteMarker, accuracyBuffer;
        let activeLocation = null;

        // ۲. تابع محاسباتی تبدیل مختصات جغرافیایی به UTM
        function projectToUTM(lat, lng) {
            // محاسبه شماره زون بر اساس طول جغرافیایی
            const zoneNumber = Math.floor((lng + 180) / 6) + 1;
            const isNorthernHemisphere = lat >= 0;
            
            // تولید کد EPSG داینامیک
            const epsgCode = `EPSG:${isNorthernHemisphere ? '326' : '327'}${zoneNumber}`;
            
            // تعریف سیستم مختصات در صورت عدم وجود در حافظه کتابخانه
            if (!proj4.defs[epsgCode]) {
                proj4.defs(epsgCode, `+proj=utm +zone=${zoneNumber} +datum=WGS84 +units=m +no_defs`);
            }
            
            // انجام تبدیل هندسی
            const projectedCoords = proj4('EPSG:4326', epsgCode, [lng, lat]);
            
            return { 
                easting: Math.round(projectedCoords[0]), 
                northing: Math.round(projectedCoords[1]), 
                zoneName: `${zoneNumber}${isNorthernHemisphere ? 'N' : 'S'}` 
            };
        }

        // ۳. فعال‌سازی سنسور GPS دستگاه
        topoMap.locate({ watch: true, enableHighAccuracy: false, timeout: 10000 });

        // ۴. رویداد دریافت موفق موقعیت
        topoMap.on('locationfound', (event) => {
            const gpsAccuracy = Math.round(event.accuracy);
            activeLocation = event.latlng;
            
            // اگر اولین بار است که موقعیت پیدا می‌شود، المان‌ها را بساز
            if (!siteMarker) {
                siteMarker = L.marker(event.latlng).addTo(topoMap);
                accuracyBuffer = L.circle(event.latlng, { 
                    radius: gpsAccuracy, 
                    color: '#0056b3', 
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(topoMap);
                
                // زوم روی نقطه برداشت شده
                topoMap.setView(event.latlng, 18);
            } else {
                // آپدیت موقعیت المان‌های موجود در حرکت کاربر
                siteMarker.setLatLng(event.latlng);
                accuracyBuffer.setLatLng(event.latlng);
                accuracyBuffer.setRadius(gpsAccuracy);
            }

            // فراخوانی تابع تبدیل و بروزرسانی رابط کاربری
            const utmResult = projectToUTM(event.latlng.lat, event.latlng.lng);
            
            document.getElementById('zoneDisplay').innerText = `UTM Zone ${utmResult.zoneName}`;
            document.getElementById('xDisplay').innerText = utmResult.easting;
            document.getElementById('yDisplay').innerText = utmResult.northing;
            document.getElementById('accDisplay').innerText = `± ${gpsAccuracy} m`;
        });

        // هندل کردن خطای احتمالی سنسور
        topoMap.on('locationerror', (err) => {
            console.warn("خطا در سیستم تعیین موقعیت: " + err.message);
        });

        // ۵. رویداد دکمه اشتراک‌گذاری داده‌ها
        document.getElementById('exportData').addEventListener('click', async () => {
            if (!activeLocation) {
                alert("لطفاً تا دریافت دقیق سیگنال GPS صبر کنید.");
                return;
            }
            
            const utm = projectToUTM(activeLocation.lat, activeLocation.lng);
            
            // قالب‌بندی متن خروجی مناسب برای مهندسین دفتر فنی
            const reportText = `Share Your Locations:\n` +
                               `سیستم: UTM Zone ${utm.zoneName}\n` +
                               `Easting (X): ${utm.easting}\n` +
                               `Northing (Y): ${utm.northing}\n` +
                               `-------------------\n` +
                               `لینک گوگل مپ:\nhttps://maps.google.com/?q=${activeLocation.lat},${activeLocation.lng}`;
            
            // استفاده از API بومی مرورگر برای اشتراک‌گذاری
            if (navigator.share) {
                try {
                    await navigator.share({ 
                        title: 'گزارش مختصات', 
                        text: reportText 
                    });
                } catch (e) {
                    console.log("عملیات ارسال لغو شد.");
                }
            } else {
                alert("مرورگر شما از قابلیت اشتراک‌گذاری پشتیبانی نمی‌کند. مختصات را دستی یادداشت کنید.");
            }
        });
    </script>
</body>
</html>
